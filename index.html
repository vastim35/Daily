<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1E2229">
<title>Мой день</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2229;
    --ink-2:#262B33;
    --paper:#EDE7DA;
    --paper-dim:#A7A190;
    --lamp:#E8A54B;
    --lamp-dim:#8a6a3a;
    --sage:#7FA98B;
    --rose:#C1666B;
    --dusk:#565C68;
    --line: rgba(237,231,218,0.14);
    --radius: 14px;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  .app{
    max-width:560px;
    margin:0 auto;
    padding:20px 16px 100px;
    min-height:100vh;
    position:relative;
  }
  /* Header */
  .greeting{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:26px;
    color:var(--paper);
    margin:4px 0 2px;
  }
  .date-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.04em;
    color:var(--paper-dim);
    text-transform:uppercase;
  }
  .top-actions{
    position:absolute;
    top:20px; right:16px;
    display:flex; gap:8px;
  }
  .icon-btn{
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--ink-2);
    color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:16px;
  }
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn.active{background:var(--lamp);color:var(--ink);border-color:var(--lamp);}

  /* Week strip */
  .week-nav{
    display:flex;align-items:center;justify-content:space-between;
    margin:22px 0 10px;
  }
  .week-label{
    font-size:13px;color:var(--paper-dim);
    font-family:'IBM Plex Mono',monospace;
  }
  .week-arrows{display:flex;gap:6px;}
  .arrow-btn{
    background:none;border:none;color:var(--paper-dim);
    font-size:16px;cursor:pointer;padding:4px 8px;
  }
  .arrow-btn:active{color:var(--lamp);}
  .week-strip{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-bottom:22px;
  }
  .day-chip{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 2px 9px;
    text-align:center;
    cursor:pointer;
    color:var(--paper);
  }
  .day-chip .dow{
    font-size:11px;color:var(--paper-dim);
    text-transform:uppercase;letter-spacing:0.03em;
  }
  .day-chip .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;margin-top:3px;font-weight:500;
  }
  .day-chip.today .num{color:var(--lamp);}
  .day-chip.selected{
    background:var(--lamp);
    border-color:var(--lamp);
  }
  .day-chip.selected .dow,.day-chip.selected .num{color:var(--ink);}
  .day-chip.has-events::after{
    content:'';display:block;width:4px;height:4px;border-radius:50%;
    background:var(--sage);margin:5px auto 0;
  }
  .day-chip.selected.has-events::after{background:var(--ink);}

  /* Timeline */
  .timeline{
    position:relative;
    margin-top:10px;
    padding-left:58px;
  }
  .timeline::before{
    content:'';
    position:absolute;
    left:44px; top:2px; bottom:2px;
    width:1px;
    background:var(--line);
  }
  .now-line{
    position:absolute;
    left:38px; right:0;
    height:0;
    border-top:2px solid var(--lamp);
    z-index:2;
  }
  .now-line::before{
    content:'';
    position:absolute;left:-4px;top:-4px;
    width:8px;height:8px;border-radius:50%;
    background:var(--lamp);
  }
  .event-row{
    position:relative;
    margin-bottom:16px;
    animation:rise 0.25s ease;
  }
  @keyframes rise{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .event-time{
    position:absolute;
    left:-58px; top:12px;
    width:44px;
    text-align:right;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--paper-dim);
  }
  .event-dot{
    position:absolute;
    left:-19px; top:16px;
    width:9px;height:9px;border-radius:50%;
    background:var(--ink);
    border:2px solid var(--sage);
    z-index:1;
  }
  .event-row.custom .event-dot{background:var(--lamp);border-color:var(--lamp);}
  .event-card{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
  }
  .event-title-row{
    display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  }
  .event-title{font-size:15px;font-weight:500;}
  .event-meta{
    font-size:12px;color:var(--paper-dim);margin-top:3px;
    font-family:'IBM Plex Mono',monospace;
  }
  .event-actions{display:flex;gap:6px;flex-shrink:0;}
  .mini-btn{
    background:none;border:none;color:var(--paper-dim);
    cursor:pointer;font-size:15px;padding:2px 4px;
  }
  .mini-btn:active{color:var(--lamp);}
  .cal-btn{
    margin-top:9px;
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;color:var(--sage);
    text-decoration:none;
    border:1px solid rgba(127,169,139,0.35);
    padding:5px 10px;border-radius:20px;
  }
  .cal-btn:active{opacity:0.7;}

  .empty-state{
    padding:36px 10px 10px;
    color:var(--paper-dim);
    font-size:14px;
    line-height:1.5;
  }
  .empty-state b{color:var(--paper);}

  /* FAB */
  .fab{
    position:fixed;
    bottom:24px; right:50%;
    transform:translateX(280px);
    width:56px;height:56px;
    border-radius:50%;
    background:var(--lamp);
    color:var(--ink);
    border:none;
    font-size:26px;
    box-shadow:var(--shadow);
    cursor:pointer;
    z-index:20;
  }
  @media (max-width:600px){
    .fab{ right:24px; transform:none; }
  }
  .fab:active{transform:scale(0.94);}
  @media (max-width:600px){ .fab:active{transform:scale(0.94);} }

  /* Bottom bar */
  .bottom-bar{
    display:flex; gap:8px;
    margin-top:26px;
  }
  .pill-btn{
    flex:1;
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--paper);
    padding:11px 10px;
    border-radius:20px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  .pill-btn:active{border-color:var(--lamp);}

  /* Modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(10,11,14,0.6);
    display:none;
    align-items:flex-end;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--ink-2);
    width:100%;
    max-width:560px;
    margin:0 auto;
    border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh;
    overflow-y:auto;
    animation:slideup 0.22s ease;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0.6}to{transform:translateY(0);opacity:1}}
  .sheet h2{
    font-family:'Fraunces',serif;font-weight:500;font-size:20px;margin:0 0 16px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:12px;color:var(--paper-dim);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:0.03em;
  }
  .field input[type=text], .field input[type=time], .field select{
    width:100%;
    background:var(--ink);
    border:1px solid var(--line);
    color:var(--paper);
    padding:11px 12px;
    border-radius:10px;
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .toggle-row{
    display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;
  }
  .toggle-chip{
    padding:8px 13px;border-radius:16px;
    border:1px solid var(--line);
    background:var(--ink);
    color:var(--paper-dim);
    font-size:13px;cursor:pointer;
  }
  .toggle-chip.on{background:var(--lamp);color:var(--ink);border-color:var(--lamp);}
  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{
    flex:1;padding:13px;border-radius:12px;border:none;
    font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .btn-primary{background:var(--lamp);color:var(--ink);}
  .btn-ghost{background:transparent;color:var(--rose);border:1px solid rgba(193,102,107,0.4);}
  .btn-secondary{background:var(--ink);color:var(--paper);border:1px solid var(--line);}

  /* Template view */
  .template-day{margin-bottom:22px;}
  .template-day h3{
    font-family:'Fraunces',serif;font-weight:500;font-size:17px;margin:0 0 10px;
    color:var(--lamp);
  }
  .tpl-row{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--ink-2);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:7px;
  }
  .tpl-row .t-time{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--paper-dim);width:48px;}
  .tpl-row .t-title{flex:1;font-size:14px;margin-left:8px;}
  .add-tpl-btn{
    width:100%;padding:10px;border-radius:10px;border:1px dashed var(--line);
    background:none;color:var(--paper-dim);font-size:13px;cursor:pointer;margin-top:2px;
  }
  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .back-row button{
    background:none;border:none;color:var(--paper);font-size:22px;cursor:pointer;padding:2px 6px 2px 0;
  }
  .back-row h1{font-family:'Fraunces',serif;font-weight:500;font-size:20px;margin:0;}

  .hint-banner{
    background:var(--ink-2);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;margin-bottom:18px;
    font-size:12.5px;line-height:1.5;color:var(--paper-dim);
  }
  .hint-banner b{color:var(--paper);}
  .hint-banner a{color:var(--sage);}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===== DAY VIEW ===== -->
  <div id="dayView">
    <div class="top-actions">
      <button class="icon-btn" id="notifBtn" title="Уведомления в браузере">🔔</button>
    </div>
    <div class="greeting" id="greeting">Добрый день</div>
    <div class="date-line" id="fullDate">—</div>

    <div class="week-nav">
      <div class="week-label" id="weekLabel">—</div>
      <div class="week-arrows">
        <button class="arrow-btn" id="prevWeek">←</button>
        <button class="arrow-btn" id="nextWeek">→</button>
      </div>
    </div>
    <div class="week-strip" id="weekStrip"></div>

    <div id="timelineWrap">
      <div class="timeline" id="timeline"></div>
    </div>

    <div class="bottom-bar">
      <button class="pill-btn" id="openTemplate">Шаблон недели</button>
      <button class="pill-btn" id="exportIcs">Экспорт в календарь (.ics)</button>
    </div>
  </div>

  <!-- ===== TEMPLATE VIEW ===== -->
  <div id="templateView" class="hidden">
    <div class="back-row">
      <button id="closeTemplate">←</button>
      <h1>Шаблон недели</h1>
    </div>
    <div class="hint-banner">Здесь — то, что повторяется <b>каждую неделю</b>. Изменения тут затронут все будущие недели, кроме дней, где ты уже что‑то поправил вручную.</div>
    <div id="templateDays"></div>
  </div>

  <button class="fab" id="fabAdd">+</button>

  <!-- ===== EVENT MODAL ===== -->
  <div class="overlay" id="overlay">
    <div class="sheet">
      <h2 id="modalTitle">Новое событие</h2>
      <div class="field-row">
        <div class="field">
          <label>Время</label>
          <input type="time" id="fTime" value="09:00">
        </div>
        <div class="field">
          <label>Длительность</label>
          <select id="fDuration">
            <option value="15">15 мин</option>
            <option value="30" selected>30 мин</option>
            <option value="45">45 мин</option>
            <option value="60">1 час</option>
            <option value="90">1.5 часа</option>
            <option value="120">2 часа</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Название</label>
        <input type="text" id="fTitle" placeholder="Например: тренировка">
      </div>
      <div class="field">
        <label>Напомнить</label>
        <select id="fRemind">
          <option value="0">Точно вовремя</option>
          <option value="5">За 5 минут</option>
          <option value="10" selected>За 10 минут</option>
          <option value="30">За 30 минут</option>
          <option value="60">За 1 час</option>
        </select>
      </div>
      <div class="field" id="scopeField">
        <label>Куда добавить</label>
        <div class="toggle-row">
          <div class="toggle-chip on" id="scopeOnce">Только на этот день</div>
          <div class="toggle-chip" id="scopeWeekly">В шаблон (каждую неделю)</div>
        </div>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-ghost hidden" id="deleteEventBtn">Удалить</button>
        <button class="btn btn-secondary" id="cancelBtn">Отмена</button>
        <button class="btn btn-primary" id="saveBtn">Сохранить</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ---------------- Storage & state ---------------- */
let template = {1:[],2:[],3:[],4:[],5:[],6:[],7:[]}; // iso weekday -> events
let overrides = {}; // dateKey -> {added:[], removedIds:[]}
let notifiedToday = new Set();
let viewingMonday = mondayOf(new Date());
let selectedDate = new Date();
let editing = null; // {mode:'template'|'day', iso, dateKey, event, isCustom}

const DOW_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DOW_FULL = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const BYDAY = ['MO','TU','WE','TH','FR','SA','SU'];

function pad(n){return n.toString().padStart(2,'0');}
function formatDate(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function isoWeekday(d){const w=d.getDay();return w===0?7:w;} // 1..7 Mon..Sun
function mondayOf(d){const c=new Date(d);const diff=isoWeekday(c)-1;c.setDate(c.getDate()-diff);c.setHours(0,0,0,0);return c;}
function addDays(d,n){const c=new Date(d);c.setDate(c.getDate()+n);return c;}
function sameDate(a,b){return formatDate(a)===formatDate(b);}
function uid(){return 'e'+Math.random().toString(36).slice(2,10);}

async function loadData(){
  try{
    const t = await window.storage.get('weekly-template');
    if(t) template = JSON.parse(t.value);
  }catch(e){ /* no data yet */ }
  try{
    const o = await window.storage.get('daily-overrides');
    if(o) overrides = JSON.parse(o.value);
  }catch(e){ /* no data yet */ }
}
async function saveTemplate(){
  try{ await window.storage.set('weekly-template', JSON.stringify(template)); }
  catch(e){ console.error('Не удалось сохранить шаблон', e); }
}
async function saveOverrides(){
  try{ await window.storage.set('daily-overrides', JSON.stringify(overrides)); }
  catch(e){ console.error('Не удалось сохранить изменения дня', e); }
}

/* ---------------- Derived data ---------------- */
function getDayEvents(date){
  const iso = isoWeekday(date);
  const key = formatDate(date);
  const removed = (overrides[key] && overrides[key].removedIds) || [];
  const tpl = (template[iso]||[]).filter(e=>!removed.includes(e.id)).map(e=>({...e, custom:false}));
  const added = ((overrides[key] && overrides[key].added) || []).map(e=>({...e, custom:true}));
  return [...tpl, ...added].sort((a,b)=>a.time.localeCompare(b.time));
}
function dayHasEvents(date){ return getDayEvents(date).length>0; }

/* ---------------- Rendering ---------------- */
function render(){
  renderGreeting();
  renderWeekStrip();
  renderTimeline();
}

function renderGreeting(){
  const h = new Date().getHours();
  const g = h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';
  document.getElementById('greeting').textContent = g;
  const opts = {weekday:'long', day:'numeric', month:'long'};
  document.getElementById('fullDate').textContent = selectedDate.toLocaleDateString('ru-RU', opts);
}

function renderWeekStrip(){
  const sunday = addDays(viewingMonday,6);
  const fmt = d=>d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
  document.getElementById('weekLabel').textContent = `${fmt(viewingMonday)} – ${fmt(sunday)}`;
  const strip = document.getElementById('weekStrip');
  strip.innerHTML='';
  const today = new Date();
  for(let i=0;i<7;i++){
    const d = addDays(viewingMonday,i);
    const chip = document.createElement('div');
    chip.className='day-chip';
    if(sameDate(d,today)) chip.classList.add('today');
    if(sameDate(d,selectedDate)) chip.classList.add('selected');
    if(dayHasEvents(d)) chip.classList.add('has-events');
    chip.innerHTML = `<div class="dow">${DOW_SHORT[i]}</div><div class="num">${d.getDate()}</div>`;
    chip.onclick=()=>{selectedDate=d; render();};
    strip.appendChild(chip);
  }
}

function renderTimeline(){
  const wrap = document.getElementById('timeline');
  wrap.innerHTML='';
  const events = getDayEvents(selectedDate);

  if(events.length===0){
    wrap.innerHTML = `<div class="empty-state">На этот день пока ничего нет. Нажми <b>+</b>, чтобы добавить дело — только на сегодня или сразу в еженедельный шаблон.</div>`;
    return;
  }

  const isToday = sameDate(selectedDate, new Date());
  if(isToday){
    const now = new Date();
    const mins = now.getHours()*60+now.getMinutes();
    const firstMin = timeToMin(events[0].time);
    const lastEv = events[events.length-1];
    const lastMin = timeToMin(lastEv.time)+ (parseInt(lastEv.duration)||30);
    if(mins>=Math.min(firstMin,mins) && mins<=Math.max(lastMin,mins)){
      // place a lightweight now-marker before the matching row, handled inline below
    }
  }

  events.forEach(ev=>{
    const row = document.createElement('div');
    row.className = 'event-row'+(ev.custom?' custom':'');
    const dot = document.createElement('div'); dot.className='event-dot';
    const timeEl = document.createElement('div'); timeEl.className='event-time'; timeEl.textContent=ev.time;
    const card = document.createElement('div'); card.className='event-card';

    const durTxt = ev.duration ? `${ev.time}–${minToTime(timeToMin(ev.time)+parseInt(ev.duration))}` : ev.time;
    const remindTxt = ev.remind>0 ? ` · напомнить за ${ev.remind} мин` : '';

    card.innerHTML = `
      <div class="event-title-row">
        <div>
          <div class="event-title">${escapeHtml(ev.title)}</div>
          <div class="event-meta">${durTxt}${remindTxt}${ev.custom?' · разово':' · по шаблону'}</div>
        </div>
        <div class="event-actions">
          <button class="mini-btn" data-act="edit">✎</button>
          <button class="mini-btn" data-act="del">✕</button>
        </div>
      </div>
      <a class="cal-btn" href="${googleCalLink(ev, ev.custom ? selectedDate : null)}" target="_blank" rel="noopener">📅 В Google Календарь</a>
    `;
    card.querySelector('[data-act="edit"]').onclick=()=>openEventModal({mode:'day', event:ev, isCustom:ev.custom});
    card.querySelector('[data-act="del"]').onclick=()=>deleteDayEvent(ev);

    row.appendChild(timeEl);
    row.appendChild(dot);
    row.appendChild(card);
    wrap.appendChild(row);
  });
}

function timeToMin(t){const [h,m]=t.split(':').map(Number);return h*60+m;}
function minToTime(m){m=((m%1440)+1440)%1440;return `${pad(Math.floor(m/60))}:${pad(m%60)}`;}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

/* ---------------- Event CRUD: day view ---------------- */
function deleteDayEvent(ev){
  const key = formatDate(selectedDate);
  if(!overrides[key]) overrides[key]={added:[],removedIds:[]};
  if(ev.custom){
    overrides[key].added = overrides[key].added.filter(e=>e.id!==ev.id);
  } else {
    overrides[key].removedIds = [...new Set([...overrides[key].removedIds, ev.id])];
  }
  saveOverrides();
  render();
}

/* ---------------- Modal ---------------- */
const overlay = document.getElementById('overlay');
function openEventModal({mode, event=null, isCustom=false, iso=null}){
  editing = {mode, event, isCustom, iso};
  document.getElementById('modalTitle').textContent = event ? 'Изменить событие' : 'Новое событие';
  document.getElementById('fTime').value = event?event.time:'09:00';
  document.getElementById('fDuration').value = event?String(event.duration||30):'30';
  document.getElementById('fTitle').value = event?event.title:'';
  document.getElementById('fRemind').value = event? String(event.remind||0) : '10';
  document.getElementById('deleteEventBtn').classList.toggle('hidden', !event);

  const scopeField = document.getElementById('scopeField');
  scopeField.classList.toggle('hidden', mode==='template');
  setScope(true);

  overlay.classList.add('open');
}
function closeModal(){ overlay.classList.remove('open'); editing=null; }
function setScope(once){
  document.getElementById('scopeOnce').classList.toggle('on', once);
  document.getElementById('scopeWeekly').classList.toggle('on', !once);
}
document.getElementById('scopeOnce').onclick=()=>setScope(true);
document.getElementById('scopeWeekly').onclick=()=>setScope(false);
document.getElementById('cancelBtn').onclick=closeModal;

document.getElementById('saveBtn').onclick=()=>{
  const title = document.getElementById('fTitle').value.trim();
  if(!title){ document.getElementById('fTitle').focus(); return; }
  const time = document.getElementById('fTime').value || '09:00';
  const duration = parseInt(document.getElementById('fDuration').value);
  const remind = parseInt(document.getElementById('fRemind').value);
  const once = document.getElementById('scopeOnce').classList.contains('on');

  if(editing.mode==='template'){
    const iso = editing.iso;
    if(editing.event){
      const idx = template[iso].findIndex(e=>e.id===editing.event.id);
      template[iso][idx] = {...template[iso][idx], time, duration, remind, title};
    } else {
      template[iso].push({id:uid(), time, duration, remind, title});
    }
    saveTemplate();
    renderTemplateView();
  } else {
    const key = formatDate(selectedDate);
    if(!overrides[key]) overrides[key]={added:[],removedIds:[]};

    if(once){
      if(editing.event && editing.isCustom){
        const idx = overrides[key].added.findIndex(e=>e.id===editing.event.id);
        overrides[key].added[idx] = {...overrides[key].added[idx], time, duration, remind, title};
      } else if(editing.event && !editing.isCustom){
        // editing a template-sourced event just for this day: hide the template one, add a custom copy
        overrides[key].removedIds = [...new Set([...overrides[key].removedIds, editing.event.id])];
        overrides[key].added.push({id:uid(), time, duration, remind, title});
      } else {
        overrides[key].added.push({id:uid(), time, duration, remind, title});
      }
      saveOverrides();
    } else {
      const iso = isoWeekday(selectedDate);
      if(editing.event && !editing.isCustom){
        const idx = template[iso].findIndex(e=>e.id===editing.event.id);
        template[iso][idx] = {...template[iso][idx], time, duration, remind, title};
      } else {
        template[iso].push({id:uid(), time, duration, remind, title});
      }
      saveTemplate();
    }
    render();
  }
  closeModal();
};

document.getElementById('deleteEventBtn').onclick=()=>{
  if(editing.mode==='template'){
    const iso = editing.iso;
    template[iso] = template[iso].filter(e=>e.id!==editing.event.id);
    saveTemplate();
    renderTemplateView();
  } else {
    deleteDayEvent({...editing.event, custom:editing.isCustom});
  }
  closeModal();
};

document.getElementById('fabAdd').onclick=()=>{
  const templateOpen = !document.getElementById('templateView').classList.contains('hidden');
  if(templateOpen) return; // template view has its own per-day add buttons
  openEventModal({mode:'day'});
};

/* ---------------- Week navigation ---------------- */
document.getElementById('prevWeek').onclick=()=>{ viewingMonday=addDays(viewingMonday,-7); render(); };
document.getElementById('nextWeek').onclick=()=>{ viewingMonday=addDays(viewingMonday,7); render(); };

/* ---------------- Template view ---------------- */
document.getElementById('openTemplate').onclick=()=>{
  document.getElementById('dayView').classList.add('hidden');
  document.getElementById('templateView').classList.remove('hidden');
  renderTemplateView();
};
document.getElementById('closeTemplate').onclick=()=>{
  document.getElementById('templateView').classList.add('hidden');
  document.getElementById('dayView').classList.remove('hidden');
  render();
};
function renderTemplateView(){
  const wrap = document.getElementById('templateDays');
  wrap.innerHTML='';
  for(let iso=1;iso<=7;iso++){
    const block = document.createElement('div');
    block.className='template-day';
    const events = [...(template[iso]||[])].sort((a,b)=>a.time.localeCompare(b.time));
    block.innerHTML = `<h3>${DOW_FULL[iso-1]}</h3>` +
      (events.length? events.map(ev=>`
        <div class="tpl-row" data-id="${ev.id}">
          <span class="t-time">${ev.time}</span>
          <span class="t-title">${escapeHtml(ev.title)}</span>
          <div class="event-actions">
            <button class="mini-btn" data-act="edit">✎</button>
            <a class="mini-btn" style="text-decoration:none" href="${googleCalLink(ev, null, iso)}" target="_blank" rel="noopener">📅</a>
          </div>
        </div>`).join('')
      : `<div style="color:var(--paper-dim);font-size:13px;padding:4px 0 8px;">Пусто</div>`) +
      `<button class="add-tpl-btn" data-iso="${iso}">+ добавить в ${DOW_FULL[iso-1].toLowerCase()}</button>`;
    wrap.appendChild(block);

    block.querySelectorAll('.tpl-row [data-act="edit"]').forEach(btn=>{
      btn.onclick=(e)=>{
        const id = e.target.closest('.tpl-row').dataset.id;
        const ev = template[iso].find(x=>x.id===id);
        openEventModal({mode:'template', event:ev, iso});
      };
    });
    block.querySelector('.add-tpl-btn').onclick=()=>openEventModal({mode:'template', iso});
  }
}

/* ---------------- Google Calendar link ---------------- */
function googleCalLink(ev, specificDate, isoForRecurring){
  const duration = parseInt(ev.duration)||30;
  let startDate;
  if(specificDate){
    startDate = new Date(specificDate);
  } else if(isoForRecurring){
    // next upcoming occurrence of that weekday, from today
    const today = new Date();
    let d = new Date(today);
    while(isoWeekday(d)!==isoForRecurring){ d = addDays(d,1); }
    startDate = d;
  } else {
    startDate = new Date(selectedDate);
  }
  const [h,m] = ev.time.split(':').map(Number);
  startDate.setHours(h,m,0,0);
  const endDate = new Date(startDate.getTime()+duration*60000);
  const fmt = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  let url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(ev.title)}&dates=${fmt(startDate)}/${fmt(endDate)}`;
  if(isoForRecurring){
    url += `&recur=${encodeURIComponent('RRULE:FREQ=WEEKLY;BYDAY='+BYDAY[isoForRecurring-1])}`;
  }
  url += `&details=${encodeURIComponent('Добавлено из приложения «Мой день»')}`;
  return url;
}

/* ---------------- .ics export ---------------- */
document.getElementById('exportIcs').onclick=()=>{
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MoyDen//RU','CALSCALE:GREGORIAN'];
  const stamp = icsStamp(new Date());

  for(let iso=1; iso<=7; iso++){
    (template[iso]||[]).forEach(ev=>{
      const today = new Date(); let d=new Date(today);
      while(isoWeekday(d)!==iso){ d=addDays(d,1); }
      const [h,m]=ev.time.split(':').map(Number);
      d.setHours(h,m,0,0);
      const end = new Date(d.getTime()+(parseInt(ev.duration)||30)*60000);
      lines.push('BEGIN:VEVENT');
      lines.push('UID:'+uid()+'@moyden');
      lines.push('DTSTAMP:'+stamp);
      lines.push('DTSTART:'+icsLocal(d));
      lines.push('DTEND:'+icsLocal(end));
      lines.push('RRULE:FREQ=WEEKLY;BYDAY='+BYDAY[iso-1]);
      lines.push('SUMMARY:'+icsEsc(ev.title));
      if(ev.remind>0){
        lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Напоминание','TRIGGER:-PT'+ev.remind+'M','END:VALARM');
      }
      lines.push('END:VEVENT');
    });
  }
  Object.keys(overrides).forEach(key=>{
    (overrides[key].added||[]).forEach(ev=>{
      const d = new Date(key+'T00:00:00');
      const [h,m]=ev.time.split(':').map(Number);
      d.setHours(h,m,0,0);
      const end = new Date(d.getTime()+(parseInt(ev.duration)||30)*60000);
      lines.push('BEGIN:VEVENT');
      lines.push('UID:'+uid()+'@moyden');
      lines.push('DTSTAMP:'+stamp);
      lines.push('DTSTART:'+icsLocal(d));
      lines.push('DTEND:'+icsLocal(end));
      lines.push('SUMMARY:'+icsEsc(ev.title));
      if(ev.remind>0){
        lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Напоминание','TRIGGER:-PT'+ev.remind+'M','END:VALARM');
      }
      lines.push('END:VEVENT');
    });
  });
  lines.push('END:VCALENDAR');

  const blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='moy-den-raspisanie.ics';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
};
function icsStamp(d){return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;}
function icsLocal(d){return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;}
function icsEsc(s){return String(s).replace(/([,;])/g,'\\$1');}

/* ---------------- In-app notifications (only while page is open) ---------------- */
const notifBtn = document.getElementById('notifBtn');
function updateNotifBtn(){
  const granted = 'Notification' in window && Notification.permission==='granted';
  notifBtn.classList.toggle('active', granted);
}
notifBtn.onclick=async ()=>{
  if(!('Notification' in window)){ alert('Этот браузер не поддерживает уведомления.'); return; }
  const perm = await Notification.requestPermission();
  updateNotifBtn();
  if(perm==='granted'){
    new Notification('Готово', {body:'Буду напоминать, пока это окно открыто на телефоне.'});
  }
};
setInterval(()=>{
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const now = new Date();
  const key = formatDate(now)+'_check';
  if(!notifiedToday.has('day-'+formatDate(now))){
    notifiedToday.clear();
    notifiedToday.add('day-'+formatDate(now));
  }
  getDayEvents(now).forEach(ev=>{
    const id = formatDate(now)+'-'+ev.id;
    if(notifiedToday.has(id)) return;
    const [h,m] = ev.time.split(':').map(Number);
    const eventTime = new Date(now); eventTime.setHours(h,m,0,0);
    const remindAt = new Date(eventTime.getTime() - (ev.remind||0)*60000);
    if(now>=remindAt && now <= new Date(eventTime.getTime()+60000)){
      new Notification(ev.title, {body: ev.remind>0? `Через ${ev.remind} мин` : 'Сейчас', tag:id});
      notifiedToday.add(id);
    }
  });
}, 20000);

/* ---------------- Init ---------------- */
(async function init(){
  await loadData();
  updateNotifBtn();
  render();
  setInterval(render, 60000);
})();
</script>
